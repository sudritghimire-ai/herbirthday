<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Saurima 🎉</title>
      <link rel="stylesheet" href="butterfly.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        *,
        *::after,
        *::before {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 25%, #ffeaa7 50%, #a29bfe 75%, #fd79a8 100%);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Animated Background Layers */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating Hearts */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 2rem;
            animation: float-up 8s infinite ease-in;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Sparkles */
        .sparkles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: sparkle-twinkle 3s infinite;
        }

        @keyframes sparkle-twinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Butterflies */
        .butterfly {
            position: absolute;
            font-size: 2rem;
            opacity: 0;
            transform: scale(0);
            transition: opacity 1s ease, transform 1s ease;
        }

        .butterfly.active {
            opacity: 1;
            transform: scale(1);
            animation: butterfly-fly 15s infinite ease-in-out;
        }

        @keyframes butterfly-fly {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(30vw, -20vh) rotate(10deg);
            }
            50% {
                transform: translate(60vw, -10vh) rotate(-10deg);
            }
            75% {
                transform: translate(30vw, -30vh) rotate(5deg);
            }
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
        }

        /* Envelope Styles */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 300px;
            height: 200px;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            position: relative;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(253, 121, 168, 0.3);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #fd79a8;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 3;
            border-radius: 10px 10px 0 0;
        }

        .envelope-wrapper.flap .envelope::before {
            transform: rotateX(180deg);
        }

        .letter {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 260px;
            height: 160px;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.4s ease;
            z-index: 2;
        }

        .envelope-wrapper.flap .letter {
            transform: translateY(-120px);
        }

        .text {
            font-family: 'Pacifico', cursive;
            color: #fd79a8;
            text-align: center;
        }

        .text strong {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fd79a8, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text p {
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .heart {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            cursor: pointer;
            z-index: 4;
            animation: heartbeat 1.5s infinite;
            box-shadow: 0 10px 30px rgba(253, 121, 168, 0.5);
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            border-radius: 50%;
        }

        .heart::before {
            top: -30px;
            left: 0;
        }

        .heart::after {
            left: 30px;
            top: 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }
            50% {
                transform: translateX(-50%) scale(1.1);
            }
        }

        /* Confetti */
        .wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes confetti-fall {
            0% {
                opacity: 1;
                transform: translateY(-100vh) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        /* Bubbles */
        .round {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: rise 10s infinite ease-in;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
            }
            50% {
                transform: translateX(100px);
            }
            100% {
                bottom: 110vh;
                transform: translateX(-50px);
            }
        }

        .round:nth-child(1) { left: 10%; animation-delay: 0s; width: 60px; height: 60px; }
        .round:nth-child(2) { left: 20%; animation-delay: 1s; width: 40px; height: 40px; }
        .round:nth-child(3) { left: 30%; animation-delay: 2s; width: 50px; height: 50px; }
        .round:nth-child(4) { left: 40%; animation-delay: 0.5s; width: 45px; height: 45px; }
        .round:nth-child(5) { left: 50%; animation-delay: 1.5s; width: 55px; height: 55px; }
        .round:nth-child(6) { left: 60%; animation-delay: 2.5s; width: 35px; height: 35px; }
        .round:nth-child(7) { left: 70%; animation-delay: 0.8s; width: 48px; height: 48px; }
        .round:nth-child(8) { left: 80%; animation-delay: 1.8s; width: 42px; height: 42px; }
        .round:nth-child(9) { left: 90%; animation-delay: 2.8s; width: 52px; height: 52px; }
        .round:nth-child(10) { left: 15%; animation-delay: 3s; width: 38px; height: 38px; }

        /* Flower Styles */
        .flower {
            position: relative;
            z-index: 5;
        }

        .flower__glass {
            width: 20vmin;
            height: 30vmin;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(162, 155, 254, 0.3));
            clip-path: polygon(0 0, 100% 0, 85% 100%, 15% 100%);
            opacity: 0.9;
            position: relative;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(162, 155, 254, 0.3);
        }

        .flower__glass::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            background: linear-gradient(135deg, #a29bfe, #fd79a8);
            width: 100%;
            height: 2vmin;
        }

        .flower__glass::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            background: linear-gradient(135deg, rgba(162, 155, 254, 0.4), rgba(253, 121, 168, 0.4));
            width: 100%;
            height: 15vmin;
        }

        .flower-pp {
            position: absolute;
            left: 45%;
            bottom: 2vmin;
        }

        .flower-pp--2 {
            left: 50%;
            bottom: 5%;
            transform-origin: 10% left;
            transform: rotate(20deg);
        }

        .flower-pp--3 {
            left: 30%;
            bottom: 5%;
            transform-origin: 10% left;
            transform: rotate(-10deg);
        }

        .flower_l {
            width: 2vmin;
            height: 56vmin;
            background: linear-gradient(to top, #81ecec, #74b9ff, #a29bfe);
            border-radius: 4vmin;
            box-shadow: 0 0 20px rgba(162, 155, 254, 0.5);
        }

        .flower-pp--2 .flower_l {
            height: 45vmin;
        }

        .flower-pp--3 .flower_l {
            height: 45vmin;
            position: relative;
            background: linear-gradient(to top, #81ecec, #74b9ff, #fd79a8);
        }

        .flower-pp--3 .flower_l::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 6vmin;
            height: 6vmin;
            transform: translate(-69%, -30%) rotate(-5deg);
            border-radius: 10vmin 10vmin 0 0;
            border: 2vmin solid #74b9ff;
            border-bottom: transparent;
            border-left: transparent;
        }

        .flower-pp--3 .flower_l::before {
            content: '';
            position: absolute;
            left: -40%;
            top: -1%;
            width: 6vmin;
            height: 2vmin;
            transform-origin: right;
            transform: translate(-100%, -80%) rotate(-20deg);
            background-color: #74b9ff;
            border-radius: 2vmin;
        }

        .f {
            position: absolute;
            top: 1vmin;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            width: 2vmin;
            height: 2vmin;
        }

        .flower-pp--2 .f {
            transform: translateX(-50%) rotate(20deg);
        }

        .flower-pp--3 .f {
            transform: translate(-350%, -50%) rotate(-120deg);
        }

        .leaf {
            position: absolute;
            left: 50%;
            bottom: 2vmin;
            transform: translateX(-50%);
            width: 5vmin;
            height: 14vmin;
            background: linear-gradient(to bottom, #ffeaa7, #fdcb6e, #fd79a8);
            clip-path: ellipse(50% 50% at 50% 50%);
            transform-origin: center bottom;
            box-shadow: 0 0 20px rgba(253, 121, 168, 0.4);
        }

        .flower.bloom .leaf {
            animation: open-flower 2s 1s backwards;
        }

        .leaf--1 {
            width: 10vmin;
            height: 12vmin;
            bottom: 3vmin;
            border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
            background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
        }

        .flower.bloom .leaf--1 {
            animation: open-flowe--middle 1.4s 1s backwards;
        }

        .leaf--2 { transform: translateX(-50%) rotate(-30deg); }
        .leaf--3 { transform: translateX(-50%) rotate(-50deg); }
        .leaf--4 { transform: translateX(-50%) rotate(-70deg); }
        .leaf--5 { transform: translateX(-50%) rotate(30deg); }
        .leaf--6 { transform: translateX(-50%) rotate(50deg); }
        .leaf--7 { transform: translateX(-50%) rotate(70deg); }

        .leaf--8 {
            width: 13vmin;
            height: 11vmin;
            bottom: 6vmin;
            left: -30%;
            border-radius: 10vmin 2vmin 10vmin 2vmin;
            transform: rotate(-55deg);
            background: linear-gradient(to left bottom, #ffeaa7, #fdcb6e, #fd79a8);
            clip-path: none;
        }

        .flower-pp--2 .leaf:not(:first-child) {
            width: 3.8vmin;
            height: 10vmin;
            background: linear-gradient(to bottom, #ff6b9d, #fd79a8, #a29bfe);
        }

        .flower-pp--3 .leaf:not(:first-child) {
            width: 3.8vmin;
            height: 10vmin;
            background: linear-gradient(to bottom, #a29bfe, #74b9ff, #fd79a8);
        }

        .flower-pp--2 .f .leaf--8 {
            width: 10vmin;
            height: 9vmin;
            bottom: 3vmin;
            left: -30%;
            transform: rotate(-50deg);
            background: linear-gradient(to left bottom, #ff6b9d, #fd79a8);
        }

        .flower-pp--3 .f .leaf--8 {
            width: 10vmin;
            height: 9vmin;
            left: -10% !important;
            background: linear-gradient(to left bottom, #a29bfe, #74b9ff);
        }

        .flower__fall-down--yellow {
            animation: none;
        }

        .flower.bloom .flower__fall-down--yellow {
            animation: flower-fall-down-yellow 8s 1.2s linear forwards;
        }

        .flower__fall-down--pink {
            animation: none;
        }

        .flower.bloom .flower__fall-down--pink {
            animation: flower-fall-down-pink 5s 1.2s linear forwards;
        }

        .flower__fall-down--purple {
            bottom: 4vmin;
            animation: none;
        }

        .flower.bloom .flower__fall-down--purple {
            animation: flower-fall-down-purple 6s 1.2s linear forwards, flower-falling 6s 7.2s linear infinite;
        }

        @keyframes open-flower {
            0% {
                transform: translateX(-50%) rotate(0);
            }
        }

        @keyframes open-flowe--middle {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0);
            }
        }

        @keyframes flower-fall-down-pink {
            0% {
                transform: rotate(-55deg);
            }
            50% {
                transform: rotateX(-100deg);
            }
            100% {
                transform: translate(2vmin, 28vmin);
            }
        }

        @keyframes flower-fall-down-yellow {
            0% {
                transform: rotate(-55deg);
            }
            50% {
                bottom: 3vmin;
                transform: rotateX(-100deg);
            }
            100% {
                transform: translate(2vmin, 70vmin) rotate(150deg);
            }
        }

        @keyframes flower-fall-down-purple {
            0% {
                transform: rotate(-50deg);
            }
            25% {
                bottom: 1vmin;
                transform: rotateX(-100deg);
                perspective: 0px;
            }
            50% {
                perspective: 0px;
                transform: translate(-30vmin, 2vmin) rotate(90deg);
            }
            75% {
                perspective: 0px;
                transform: translate(-34vmin, -2vmin);
            }
            100% {
                transform-origin: center;
                transform: translate(-34vmin, -2vmin) rotateY(-80deg) rotateX(35deg);
            }
        }

        @keyframes flower-falling {
            0%, 100% {
                transform-origin: center;
                transform: translate(-34vmin, -2vmin) rotateY(-80deg) rotateX(35deg);
            }
            25% {
                transform-origin: center;
                transform: translate(-34.4vmin, -2vmin) rotateY(-84deg) rotateX(35deg);
            }
            50% {
                transform-origin: center;
                transform: translate(-32vmin, -4.2vmin) rotateY(-80deg) rotateX(35deg);
            }
            75% {
                transform-origin: center;
                transform: translate(-36vmin, 1.1vmin) rotateY(-80deg) rotateX(35deg);
            }
        }

        /* Click instruction */
        .instruction {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Pacifico', cursive;
            font-size: 1.5rem;
            color: white;
            text-shadow: 0 2px 10px rgba(253, 121, 168, 0.5);
            z-index: 100;
            animation: pulse 2s infinite;
            text-align: center;
            padding: 0 1rem;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
            50% {
                opacity: 0.7;
                transform: translateX(-50%) scale(1.05);
            }
        }

        @media (max-width: 768px) {
            .envelope {
                width: 250px;
                height: 170px;
            }

            .envelope::before {
                border-left: 125px solid transparent;
                border-right: 125px solid transparent;
                border-top: 85px solid #fd79a8;
            }

            .letter {
                width: 210px;
                height: 130px;
                padding: 15px;
            }

            .text strong {
                font-size: 1.2rem;
            }

            .text p {
                font-size: 1rem;
            }

            .instruction {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

    <script>
        // Floating Hearts
        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            const hearts = ['💖', '💕', '💗', '💓', '💝'];
            
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heart.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 10000);
            }, 2000);
        }

        // Sparkles
        function createSparkles() {
            const container = document.getElementById('sparkles-container');
            
            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 3 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(sparkle);
            }
        }

        // Envelope and Heart functionality
        document.addEventListener('DOMContentLoaded', () => {
            createFloatingHearts();
            createSparkles();

            const envelope = document.querySelector('.envelope-wrapper');
            const heart = document.querySelector('.heart');
            const wrapper = document.querySelector('.wrapper');
            const bamSound = document.getElementById('bam-sound');
            const butterflies = document.querySelectorAll('.butterfly');
            const flowers = document.getElementById('flowers');
            let soundPlayed = false;
            let envelopeOpened = false;

            envelope.addEventListener('click', () => {
                envelope.classList.toggle('flap');
                
                if (!envelopeOpened && envelope.classList.contains('flap')) {
                    envelopeOpened = true;
                    
                    setTimeout(() => {
                        butterflies.forEach(butterfly => {
                            butterfly.classList.add('active');
                        });
                        
                        setTimeout(() => {
                            flowers.classList.add('bloom');
                        }, 2000);
                    }, 500);
                }
            });

            heart.addEventListener('click', (e) => {
                e.stopPropagation();
                
                if (!soundPlayed) {
                    soundPlayed = true;
                    bamSound.play();

                    // Create confetti explosion
                    for (let i = 0; i < 150; i++) {
                        const confetti = document.createElement('div');
                        confetti.classList.add('confetti');
                        confetti.style.left = `${Math.random() * 100}vw`;
                        confetti.style.top = `${Math.random() * 100}vh`;
                        confetti.style.width = `${Math.random() * 15 + 5}px`;
                        confetti.style.height = confetti.style.width;
                        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                        wrapper.appendChild(confetti);

                        confetti.style.animation = `confetti-fall ${Math.random() * 3 + 3}s linear forwards`;
                        confetti.style.animationDelay = `${Math.random() * 0.5}s`;

                        confetti.addEventListener('animationend', () => {
                            confetti.remove();
                        });
                    }

                    // Create heart explosion
                    const heartEmojis = ['💖', '💕', '💗', '💓', '💝', '💘', '💞'];
                    for (let i = 0; i < 30; i++) {
                        const heartConfetti = document.createElement('div');
                        heartConfetti.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
                        heartConfetti.style.position = 'absolute';
                        heartConfetti.style.fontSize = '2rem';
                        heartConfetti.style.left = `${Math.random() * 100}vw`;
                        heartConfetti.style.top = `50vh`;
                        heartConfetti.style.pointerEvents = 'none';
                        wrapper.appendChild(heartConfetti);

                        heartConfetti.style.animation = `confetti-fall ${Math.random() * 3 + 3}s ease-out forwards`;

                        heartConfetti.addEventListener('animationend', () => {
                            heartConfetti.remove();
                        });
                    }
                }
            });
        });
    </script>
